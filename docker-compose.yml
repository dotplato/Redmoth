services:
  db:
    image: postgres:16-alpine
    container_name: redmoth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: redmoth
      POSTGRES_PASSWORD: redmoth
      POSTGRES_DB: redmoth
    ports:
      - "5432:5432"
    volumes:
      - redmoth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmoth -d redmoth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redmoth_pg:
