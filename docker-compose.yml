services:
  db:
    image: postgres:16-alpine
    container_name: toolsmade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toolsmade
      POSTGRES_PASSWORD: toolsmade
      POSTGRES_DB: toolsmade
    ports:
      - "5432:5432"
    volumes:
      - toolsmade_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolsmade -d toolsmade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toolsmade_pg:
